# Fliper Engine: official Godot (MIT) + overlay/ → Windows installer, macOS .dmg, Linux .tar.gz → GitHub Release.
# Public repo = free minutes on every OS. Windows signing via SignPath (free for open source) when the
# SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable are set. Also copies to fliperstudio.com/download
# when the Cloudflare secrets exist.
name: "Build Fliper Engine"
on:
  workflow_dispatch:
    inputs:
      mac:
        description: "Build macOS (Apple Silicon) too"
        type: boolean
        default: true
      publicar:
        description: "Publish the release"
        type: boolean
        default: true

env:
  GODOT_TAG: 4.7.2-stable
  SCONSFLAGS: production=yes debug_symbols=no

jobs:
  fonte:
    runs-on: ubuntu-24.04
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@v4
      - name: Official Godot + Fliper overlay
        run: |
          git clone -q --depth 1 --branch "$GODOT_TAG" https://github.com/godotengine/godot.git motor
          cp -r overlay/. motor/
          python3 motor/misc/fliper/embutir_addon.py
          tar -czf fonte.tgz -C motor --exclude=.git .
      - id: v
        run: echo "versao=0.2.$(date +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: fonte, path: fonte.tgz, retention-days: 2 }

  linux:
    needs: fonte
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - run: mkdir motor && tar -xzf fonte.tgz -C motor
      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev libxkbcommon-dev libfontconfig-dev libdbus-1-dev
          pip install scons
      - name: Compilar
        working-directory: motor
        run: scons platform=linuxbsd target=editor -j$(nproc)
      - name: Empacotar
        run: |
          mkdir -p dist/FliperEngine && cp motor/bin/godot.linuxbsd.editor.x86_64 dist/FliperEngine/FliperEngine.x86_64
          cp -r starter "dist/FliperEngine/My first game"
          printf '#!/bin/sh\ncd "$(dirname "$0")" && exec ./FliperEngine.x86_64 -e --path "My first game"\n' > dist/FliperEngine/fliper.sh && chmod +x dist/FliperEngine/fliper.sh
          cp motor/LICENSE.txt motor/COPYRIGHT.txt dist/FliperEngine/ && tar -czf FliperEngine-linux-x86_64.tar.gz -C dist FliperEngine
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: FliperEngine-linux-x86_64.tar.gz }

  windows:
    needs: fonte
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      SIGNPATH: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - shell: bash
        run: mkdir motor && tar -xzf fonte.tgz -C motor
      - run: pip install scons
      - name: Dependências do Godot no Windows (leitor de tela e Direct3D 12)
        working-directory: motor
        run: |
          python misc/scripts/install_accesskit.py
          python misc/scripts/install_d3d12_sdk_windows.py
      - name: Compilar
        working-directory: motor
        run: scons platform=windows target=editor -j4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/FliperEngine | Out-Null
          Copy-Item motor/bin/godot.windows.editor.x86_64.exe dist/FliperEngine/FliperEngine.exe
          Copy-Item motor/bin/godot.windows.editor.x86_64.console.exe dist/FliperEngine/FliperEngine_console.exe -ErrorAction SilentlyContinue
          Copy-Item motor/COPYRIGHT.txt, LICENSE.txt dist/FliperEngine/
          Copy-Item motor/LICENSE.txt dist/FliperEngine/LICENSE-GODOT.txt
      - id: exe
        if: env.SIGNPATH == 'yes'
        uses: actions/upload-artifact@v4
        with: { name: exe-unsigned, path: "dist/FliperEngine/*.exe" }
      - name: Sign the editor (SignPath)
        if: env.SIGNPATH == 'yes'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fliper-engine
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/FliperEngine
      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=${{ needs.fonte.outputs.versao }}" instalador.iss
          Move-Item Output/FliperEngineSetup.exe FliperEngineSetup.exe
      - id: setup
        if: env.SIGNPATH == 'yes'
        uses: actions/upload-artifact@v4
        with: { name: setup-unsigned, path: FliperEngineSetup.exe }
      - name: Sign the installer (SignPath)
        if: env.SIGNPATH == 'yes'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: fliper-engine
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: .
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: FliperEngineSetup.exe }

  macos:
    needs: fonte
    if: inputs.mac
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fonte }
      - run: mkdir motor && tar -xzf fonte.tgz -C motor
      - run: pip3 install scons --break-system-packages || pip3 install scons
      - name: Dependências (leitor de tela)
        working-directory: motor
        run: python3 misc/scripts/install_accesskit.py
      - name: Compilar (Apple Silicon, Metal)
        working-directory: motor
        run: scons platform=macos target=editor arch=arm64 vulkan=no -j$(sysctl -n hw.ncpu)
      - name: .dmg
        run: |
          mkdir -p dmg && cp -R motor/misc/dist/macos_tools.app "dmg/Fliper Engine.app"
          mkdir -p "dmg/Fliper Engine.app/Contents/MacOS" && cp motor/bin/godot.macos.editor.arm64 "dmg/Fliper Engine.app/Contents/MacOS/Godot"
          chmod +x "dmg/Fliper Engine.app/Contents/MacOS/Godot" && ln -s /Applications dmg/Applications
          hdiutil create -volname "Fliper Engine" -srcfolder dmg -ov -format UDZO FliperEngine-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: FliperEngine-macos.dmg }

  publicar:
    needs: [fonte, linux, windows, macos]
    if: always() && inputs.publicar && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      V: ${{ needs.fonte.outputs.versao }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true, pattern: "{linux,windows,macos}" }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "v$V" dist/FliperEngineSetup.exe dist/*.tar.gz $(ls dist/*.dmg 2>/dev/null) --repo "${{ github.repository }}" \
            --title "Fliper Engine $V" --notes "Fliper Engine $V, built on Godot 4.7.2 (MIT). Windows: run FliperEngineSetup.exe. macOS: open the .dmg and drag to Applications (first time: right-click › Open). Linux: extract and run FliperEngine.x86_64. Also at https://fliperstudio.com/download/"
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22 }
      - name: Copy to fliperstudio.com/download (optional)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for f in dist/*; do
            npx --yes wrangler@4 r2 object put "fliper-ia-arquivos/downloads/engine/$V/$(basename "$f")" --file "$f" --content-type application/octet-stream --remote
          done
          python3 - <<'PY'
          import json, os, datetime
          v = os.environ['V']
          tipos = {'FliperEngineSetup.exe': 'windows', 'FliperEngine-macos.dmg': 'macos', 'FliperEngine-linux-x86_64.tar.gz': 'linux'}
          arq = {tipos[n]: {'url': f'/download/engine/{v}/{n}', 'nome': n, 'bytes': os.path.getsize('dist/' + n), 'versao': v} for n in os.listdir('dist') if n in tipos}
          json.dump({'versao': v, 'data': datetime.date.today().isoformat(), 'base': 'Godot 4.7.2', 'arquivos': arq}, open('latest.json', 'w'), indent=1)
          PY
          npx --yes wrangler@4 r2 object put "fliper-ia-arquivos/downloads/engine/latest.json" --file latest.json --content-type application/json --remote
